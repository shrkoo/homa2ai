name = "homa-ai-core"
main = "homa-ai-worker.js"
compatibility_date = "2024-09-01"

# ===== KV Namespaces =====

[[kv_namespaces]]
binding = "GOOGLE_TOKENS"
id = "cf4d81add5a44f42a32cff34c46e2f90"

[[kv_namespaces]]
binding = "USER_CONNECTIONS"
id = "f5ccb2cffddf4e14ac9fd2346d81ba7e"

# ===== D1 Database =====

[[d1_databases]]
binding = "DB"
database_name = "homa-ai-db"
database_id = "YOUR_D1_DATABASE_ID"

# ===== Smart Watch Cron Trigger =====

[triggers]
crons = ["*/30 * * * *"]
